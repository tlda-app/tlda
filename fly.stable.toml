# fly.stable.toml — staging/boot-verification Fly app for the live tlda backend.
# Deploy with: fly deploy -c fly.stable.toml
app = "tldraw-sync-skip-stable"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.live"

[env]
  PORT = "5176"
  NODE_ENV = "production"
  # Everything else this server needs now lives in config/deployments/stable/,
  # committed and baked into the image. TLDA_DEPLOYMENT names that directory and
  # is the only pointer that must arrive from outside it.
  TLDA_DEPLOYMENT = "stable"

[[vm]]
  size = "performance-2x"
  memory = "4096"

[mounts]
  source = "sync_data"
  destination = "/app/server/persist"
