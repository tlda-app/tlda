# fly.talk.toml — a public presentation box for viewers outside the tailnet.
#
# Deploy with:  npm run deploy:live -- --fly-config fly.talk.toml
#
# A funnel can expose the tailnet hostname publicly when the deployment needs it.
app = "tlda-talk"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.live"

[env]
  PORT = "5176"
  NODE_ENV = "production"
  TLDA_DEPLOYMENT = "talk"
  # Its own tailnet node, separate from testing.
  TS_HOSTNAME = "presentation"
  # Expose with `tailscale funnel` instead of `tailscale serve`. Unset on every
  # other deployment, which stay tailnet-only.
  TS_FUNNEL = "1"

# No [http_service] — nothing is served on *.fly.dev. Public reach is the funnel
# on the .ts.net name. No public service also means no autostop, so the machine
# stays up on its CMD + volume mount.
[[vm]]
  size = "performance-1x"
  memory = "2048"

# Its own volume. Deliberately NOT `sync_data`: this box starts with an empty
# store and gets only the presentation project copied in. No fleet database, no chat
# history, no other projects.
[mounts]
  source = "talk_data"
  destination = "/app/server/persist"
