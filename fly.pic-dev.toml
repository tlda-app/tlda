# fly.pic-dev.toml — isolated course-development backend, cloned from testing.
# Same image and deployment configuration as testing; its own app, volume, and
# tailnet name keep heavy class builds away from the testing serving box.
# Deploy with: fly deploy -c fly.pic-dev.toml
app = "tlda-pic-dev"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.live"

[env]
  PORT = "5176"
  NODE_ENV = "production"
  TLDA_DEPLOYMENT = "pic-dev"
  TS_HOSTNAME = "course-dev"

[[vm]]
  size = "performance-2x"
  # Sized to absorb concurrent course builds without starving the testing
  # serving box.
  memory = "8192"

[mounts]
  source = "sync_data"
  destination = "/app/server/persist"
