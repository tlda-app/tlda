# Server settings for the preview store -- the second tlda server on a box that
# carries the preview site, holding its marks apart from the live ones.
appName: PIC preview

# Public, and gated, for the same reason the live one is: it shares a box whose
# public exposure is Tailscale Funnel, and funnel is per port, not per box. The
# preview site's own reason to be reachable is Skip, who is not always on the
# tailnet; the gate is what keeps "reachable by him" from meaning "writable by
# anyone who finds the hostname".
tokenGating: true

tokensFromEnvironmentOnly: true

# One search child rather than the default four. This server is a second tlda
# process on a box that already runs one, and what it holds is the preview's
# marks -- a handful of rooms, not a corpus. Four children here would be four
# processes competing with the server the course is actually served from.
searchWorkers: 1

uploadDir: /app/server/persist/preview-store/uploads

notifications:
  ackTimeout: 5s
