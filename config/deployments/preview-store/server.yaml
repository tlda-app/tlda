# Server settings for the preview store -- the second tlda server on a box that
# carries the preview site, holding its marks apart from the live ones.
appName: PIC preview

# GATED, FOR NOW, AND NOT BECAUSE ANYONE WANTS IT. Skip's ruling stands --
# nobody asked for the token gate and it is on its way out: it is one shared
# string, the same characters for everyone holding it, so it can say whether a
# caller has the box's key and nothing about who they are. The per-person rule
# underneath it (`classroomRoomAccess`) is the boundary that should decide.
#
# What stops the gate coming off here is one derivation, not the design. The
# rule that a server where nobody can be told apart grants everybody write is
# currently derived from the gate being off -- so turning the gate off on THIS
# box, which is funnelled, would hand every room on it to the internet.
# Deriving it from "has a class" instead was tried on 2026-09-21 and reverted
# the same hour: a dev box is (gate off, courses present) and must grant, this
# box is (gate off, courses present) and must not, and no predicate over those
# two facts separates them.
#
# So the gate comes off here when a deployment can say what its gate-off means,
# which is a config split rather than a flag. Until then this box is gated and
# carries nobody, which costs nothing.
tokenGating: true

tokensFromEnvironmentOnly: true

# One search child rather than the default four. This server is a second tlda
# process on a box that already runs one, and what it holds is the preview's
# marks -- a handful of rooms, not a corpus. Four children here would be four
# processes competing with the server the course is actually served from.
searchWorkers: 1

uploadDir: /app/server/persist/preview-store/uploads

notifications:
  ackTimeout: 5s
