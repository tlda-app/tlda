# Server settings for the preview store -- the second tlda server on a box that
# carries the preview site, holding its marks apart from the live ones.
appName: PIC preview

# NO TOKEN GATE. Nobody asked for one and it is on its way out: it is a single
# shared string, the same characters for everyone holding it, so it can say
# whether a caller has the box's key and nothing about who they are.
#
# What decides here instead is the per-person rule that was always underneath
# it -- `classroomRoomAccess` in shared/classroom-rooms.mjs, reading the
# student's own enrolment token. It already says the book is open to read, an
# enrolled student writes, a grading draft is an instructor's alone, and
# handed-in work is its owner's. That is the boundary; the shared string was
# standing in front of it refusing people before it could be asked.
#
# THIS IS ONLY SAFE BECAUSE THIS SERVER KNOWS THE CLASS. It reads the same
# classroom database the main server writes (TLDA_CLASSROOM_DB, set in
# scripts/fly-entrypoint-live.sh), so the people are the same people. A preview
# store with its own empty classroom would know nobody, and a server that knows
# nobody withholds nothing from anyone -- which on a funnelled box means the
# internet.
tokenGating: false

tokensFromEnvironmentOnly: true

# One search child rather than the default four. This server is a second tlda
# process on a box that already runs one, and what it holds is the preview's
# marks -- a handful of rooms, not a corpus. Four children here would be four
# processes competing with the server the course is actually served from.
searchWorkers: 1

uploadDir: /app/server/persist/preview-store/uploads

notifications:
  ackTimeout: 5s
