# Server settings for the preview store -- the second tlda server on a box that
# carries the preview site, holding its marks apart from the live ones.
appName: PIC preview

# GATED, LIKE THE PUBLISHED SITE, BECAUSE IT IS THE PUBLISHED SITE WITH A
# DIFFERENT CONFIG PATCHED IN. Skip, 2026-09-21: *"a preview matches the fking
# published version"*, following *"i never said the preview store was
# ungated"*. So the preview has no auth posture of its own to decide: its
# static half is public-read exactly as the published one is, and its store is
# gated and per-person identically to the live store. Same mechanism, same
# settings, which is also what makes switching one over to the other trivial.
#
# THIS FILE PREVIOUSLY SAID THE OPPOSITE IN HIS NAME. It read "nobody asked for
# the token gate and it is on its way out", attributed to a ruling of his. He
# had said nobody asked for token auth and that it is trivially disabled in
# config; turning it off *here*, on a funnelled box, was my inference wearing
# his name. Recorded rather than quietly deleted, because a wrong attribution
# in a config comment is how one becomes a constraint nobody can trace.
tokenGating: true

tokensFromEnvironmentOnly: true

# One search child rather than the default four. This server is a second tlda
# process on a box that already runs one, and what it holds is the preview's
# marks -- a handful of rooms, not a corpus. Four children here would be four
# processes competing with the server the course is actually served from.
searchWorkers: 1

uploadDir: /app/server/persist/preview-store/uploads

notifications:
  ackTimeout: 5s
