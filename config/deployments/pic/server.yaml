# What this deployment calls itself in the browser tab. dist/ is one built
# artifact every deployment serves, so the title cannot be baked in per
# deployment; the server rewrites it on the way out. The installed web app
# takes the same name from dist-overrides/manifest.webmanifest.
appName: PIC

# Server settings for this deployment. Installed to ~/.config/tlda/server.yaml
# by scripts/fly-entrypoint-live.sh. These were fly.*.toml [env] variables until
# an unset one presented as a missing feature instead of an error.

# How THIS SERVER reaches the one Deepgram bridge, on the tlda-voice box, over
# Fly's private 6PN. REQUIRED — there is no second bridge and no fallback.
# One box serves every site (see fly.voice.toml), so this address is the same
# everywhere.
deepgramBridgeUrl: ws://tlda-voice.internal:8180

# How THE BROWSER reaches the same box, over the tailnet. Handed to the client so
# its audio socket terminates on the voice box instead of on this server.
#
# Absent, the browser falls back to the same-origin proxy — this machine — so
# deploying the app cut Skip off mid-sentence, which is the exact thing the
# separate box exists to prevent. It was absent everywhere, so the browser had
# never used the box at all: `directUrl` came back empty from every deployment
# and every byte of his audio was proxied through the app server.
deepgramDirectUrl: wss://tlda-voice.cormorant-matrix.ts.net

# PIC is public through Tailscale Funnel. The shared read token admits the book
# and common classroom surface; the RW token remains the instructor capability.
# Student-owned data has the additional classroom enrollment-token checks in the
# classroom and sync routes.
tokenGating: true

# Take tokens only from TLDA_TOKEN_READ/TLDA_TOKEN_RW (`fly secrets`), never
# from a tokens.json on the box.
tokensFromEnvironmentOnly: true

# Uploads must land on the persistent volume; the container wipes anything else
# on restart, which once 404'd markdown chips out from under their viewers.
uploadDir: /app/server/persist/uploads

# How long the server waits for an agent's MCP to acknowledge a notification
# before reporting the symptom to that agent's daemon. This is the one rule the
# notification path runs: no ack within this long -> report `channel-silent`.
#
# ORDERING CONSTRAINT: this must EXCEED the MCP's own serial budget for handling
# a notice -- deliverChannelNotice (<=1000ms) then acknowledgeWakeChannelNotice
# (<=1000ms), one after the other.
#
# THIS RAN AT 2s FOR MONTHS AND 2s COULD NEVER WORK. It is exactly the two
# client budgets summed, while the server's clock also has to cover the trip out
# and the ack back -- so a delivery that fully succeeded could not acknowledge in
# time, and the overrun was recorded as `mcp-ack-timeout`, the same string a
# wedged process produces. A healthy agent was indistinguishable from a dead one.
# 5s clears the serial budget with room for both network legs.
#
# RAISING IT IS NOT A FREE WIN. The largest single source of these timeouts
# measured on this fleet was one bot holding a socket with no acknowledge path in
# its code at all -- 88% of them. A longer deadline does not turn those into
# successes, it makes each take longer to reach the same outcome. The fix for
# that population is the bot. See docs/notifications-and-liveness.md "Errata".
#
# The unit is part of the value (the `batch(15s)` precedent, same parser). A
# bare `5` is an error, not a default in some unit you have to guess.
notifications:
  ackTimeout: 5s
