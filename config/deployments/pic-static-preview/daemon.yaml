# Environment authority for the PREVIEW half of the pic-static box.
#
# This is not a whole deployment of its own -- the box's deployment is
# `pic-static`, and scripts/fly-entrypoint-live.sh installs this file into a
# per-instance config directory on the volume rather than into ~/.config/tlda.
# It is a directory under config/deployments/ because that is where the
# entrypoint already reads committed configuration from, and because an
# environment that lives in git is what stopped an absent value from silently
# becoming someone else's default.
#
# THE LIVE HALF IS NOT HERE. Sync and hand-in for the published site run on
# `pic`; see the comment in scripts/fly-entrypoint-live.sh for why moving them
# would lose student work.
machineId: fly

# THIS ENVIRONMENT IS THE PREVIEW SITE'S DESTINATION CONFIG, and the fact that it
# is a different store from live's is the entire point. A room name is unique only
# within one server (server/lib/sync-rooms.mjs), so a mark made while previewing
# lands here and not in the published site's rooms. A shared room was proposed and
# rejected for exactly that reason: it would have made a preview mark a live mark,
# with no draft boundary and no undo boundary between them.
#
# Nothing reconciles the two in the background. A button on the preview site
# copies live shapes over on demand, which is why there is nothing to drift.
environments:
  default: pic-static-preview
  values:
    pic-static-preview:
      # fleet, chat, registry, agents
      database: https://tlda-pic-static.cormorant-matrix.ts.net:8443
      # document assets and shape sync
      store: https://tlda-pic-static.cormorant-matrix.ts.net:8443

      # The preview site is served from this box's own tailnet hostname, so the
      # licence bound to *.cormorant-matrix.ts.net covers it. Same key as every
      # other box on this tailnet (config/deployments/pic/daemon.yaml); it is a
      # client-side value shipped to every browser, not a secret.
      #
      # 8443 because Tailscale Funnel publishes three ports and 443 is the file
      # server. The published site's destination config is pic's, not this one.
      licenseKey: tldraw-david-hirshberg-2031-06-29/WyJpTW00VFpraCIsWyIqLmNvcm1vcmFudC1tYXRyaXgudHMubmV0Il0sOSwiMjAzMS0wNi0yOSJd.76nwqwOXRChl0rxuqrgwvwOqZ+Aztw8sC+qFOFixTWyVpH96riTXLDVOY83AFmW0GRcHodjkGpjUvdh/GouzzA

taskDoc:
  globalDir: /app/server/persist/instances/preview/fleet-task-doc
