# Server settings for this deployment. Installed to ~/.config/tlda/server.yaml
# by scripts/fly-entrypoint-live.sh. These were fly.*.toml [env] variables until
# an unset one presented as a missing feature instead of an error.

# How THIS SERVER reaches the one Deepgram bridge, on the tlda-voice box, over
# Fly's private 6PN. REQUIRED — there is no second bridge and no fallback.
# One box serves every site (see fly.voice.toml), so this address is the same
# everywhere.
deepgramBridgeUrl: ws://tlda-voice.internal:8180

# Unlike the tailnet boxes this one is on the public internet, so token gating
# stays ON and the tokens come only from `fly secrets`.
#
# This used to be carried by the ABSENCE of `authDisabled`, which meant the only
# gated deployment was the one that said nothing about gating. `tokenGating`
# defaults false, so it is stated here instead — the posture of a public box is
# now readable in its config rather than inferred from a missing key.
tokenGating: true
tokensFromEnvironmentOnly: true

# No uploadDir: the default ~/.config/tlda/uploads is already the persistent
# volume here, because the entrypoint symlinks that whole directory onto it.

# How long the server waits for an agent's MCP to acknowledge a notification
# before reporting the symptom to that agent's daemon. This is the one rule the
# notification path runs: no ack within this long -> report `channel-silent`.
#
# ORDERING CONSTRAINT: this must EXCEED the MCP's own serial budget for handling
# a notice -- deliverChannelNotice (<=1000ms) then acknowledgeWakeChannelNotice
# (<=1000ms), one after the other.
#
# THE VALUE BELOW DOES NOT SATISFY THAT, AND THAT IS DELIBERATE. 2s is exactly
# the two client budgets summed, and the server's clock starts before the notice
# leaves it, so this deadline must also cover the trip out and the ack back. A
# delivery that fully succeeds cannot acknowledge in time, and the overrun is
# recorded as `mcp-ack-timeout` -- the same string a wedged process produces.
#
# It is 2s because that is what was already running. Moving the setting out of
# the code is settled; THE NUMBER IS NOT, and it is Skip's -- see
# docs/notifications-and-liveness.md "What is not settled", item 1. Raising it
# is not a free win either: the largest single source of these timeouts is a bot
# with no acknowledge path at all, for which a longer deadline only means waiting
# longer to reach the same outcome.
#
# The unit is part of the value (the `batch(15s)` precedent, same parser). A
# bare `2` is an error, not a default in some unit you have to guess.
notifications:
  ackTimeout: 2s
