# Daemon/environment authority for a public presentation deployment. Installed to
# ~/.config/tlda/daemon.yaml by scripts/fly-entrypoint-live.sh.
machineId: fly-presentation

# An environment is a COMPLETE set of three fields; a missing one fails at
# startup rather than being guessed.
environments:
  default: talk
  values:
    talk:
      # fleet, chat, registry, agents — this box's own, empty, and not shared
      # with testing or stable. Nothing here reaches the fleet database.
      database: https://presentation.example.invalid
      # document assets and shape sync
      store: https://presentation.example.invalid
      # Public examples are explicitly unlicensed. Put a licensed client value
      # in private deployment configuration when needed.
      licenseKey: ""

taskDoc:
  globalDir: /app/server/persist/fleet-task-doc
