# Daemon/environment authority for a frozen pre-publication course candidate.
# Installed to ~/.config/tlda/daemon.yaml by scripts/fly-entrypoint-live.sh.
machineId: fly

# An environment is a COMPLETE set of three fields; a missing one fails at
# startup rather than being guessed. `default` names the active one — this
# used to come from the TLDA_ENV environment variable, and now lives with the
# environments it selects between.
#
# The candidate carries course content and class configuration, but its fleet,
# chat and sync state are separate from the published environment:
# validating a candidate must not write into the student box's rooms.
environments:
  default: pic-preview
  values:
    pic-preview:
      # fleet, chat, registry, agents
      database: https://course-preview.example.invalid
      # document assets and shape sync
      store: https://course-preview.example.invalid
      # Public examples are explicitly unlicensed. Put a licensed client value
      # in private deployment configuration when needed.
      licenseKey: ""

taskDoc:
  globalDir: /app/server/persist/fleet-task-doc
