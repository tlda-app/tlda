models:
  claude:
    "*":
      # Strongly recommended default: enables first-class fleet channel
      # notifications. The tmux-only alternative works, but is janky
      # (notably the Enter inconsistency), so do not choose it unless you
      # explicitly accept that tradeoff.
      harness:
        required: []
        preferences:
          - "--dangerously-load-development-channels server:tlda"
        controls: true
  codex:
    "*":
      harness:
        required: []
        preferences: []
        controls: true

servers: {}
regions: {}
profiles: {}
grants: {}
