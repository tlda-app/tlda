models:
  default: terra
  values:
    muse:
      id: muse-spark-1.3-contributor[1m]
      harness:
        kind: claude
        # First-class fleet channel notifications, same required flag as opus.
        required:
          - "--dangerously-load-development-channels server:tlda"
        preferences: []
        controls: true
        env:
          ANTHROPIC_BASE_URL: https://api.meta.ai
          ANTHROPIC_MODEL: muse-spark-1.3-contributor[1m]
          ANTHROPIC_DEFAULT_OPUS_MODEL: muse-spark-1.3-contributor[1m]
          ANTHROPIC_DEFAULT_SONNET_MODEL: muse-spark-1.3-contributor[1m]
          ANTHROPIC_DEFAULT_HAIKU_MODEL: muse-spark-1.3-contributor[1m]
          CLAUDE_CODE_SUBAGENT_MODEL: muse-spark-1.3-contributor[1m]
          CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY: 1
      group: muse
      level: 1
      description: Muse Spark via Claude Code (Meta Model API)
      options:
        effort:
          default: high
          values:
            low: {}
            medium: {}
            high: {}
    muse-meta:
      id: muse-spark-1.3-contributor
      harness:
        kind: muse
        required:
          - --yolo
        preferences: []
        controls: true
      group: muse
      level: 1
      options:
        effort:
          default: high
          values:
            low: {}
            medium: {}
            high: {}
    opus:
      id: opus
      harness:
        kind: claude
        # Strongly recommended default: enables first-class fleet channel
        # notifications. The tmux-only alternative works, but is janky
        # (notably the Enter inconsistency), so do not choose it unless you
        # explicitly accept that tradeoff.
        required:
          - "--dangerously-load-development-channels server:tlda"
        preferences: []
        controls: true
      group: claude
      level: 4
      description: Claude Opus
      options:
        effort:
          default: medium
          values:
            low: {}
            medium: {}
            high: {}
    gpt:
      id: gpt-5.5
      harness:
        kind: codex
        # Codex's own sandbox is off; containment is the fence (from the grant) or a
        # deliberate wide-open daemon launch. The code decides no launch argument —
        # this flag is the config passing codex's sandbox setting through.
        required:
          - "--dangerously-bypass-approvals-and-sandbox"
        preferences: []
        controls: true
      group: codex
      level: 1
      description: Codex GPT
      options:
        effort:
          default: medium
          values:
            low: {}
            medium: {}
            high: {}
    sol:
      id: gpt-5.6-sol
      harness:
        kind: codex
        required:
          - "--dangerously-bypass-approvals-and-sandbox"
        preferences: []
        controls: true
      group: codex
      level: 2
      description: Codex Sol
      options:
        effort:
          default: medium
          values:
            low: {}
            medium: {}
            high: {}
    luna:
      id: gpt-5.6-luna
      harness:
        kind: codex
        required:
          - "--dangerously-bypass-approvals-and-sandbox"
        preferences: []
        controls: true
      group: codex
      level: 3
      description: Codex Luna
      options:
        effort:
          default: medium
          values:
            low: {}
            medium: {}
            high: {}
    terra:
      id: gpt-5.6-terra
      harness:
        kind: codex
        required:
          - "--dangerously-bypass-approvals-and-sandbox"
        preferences: []
        controls: true
      group: codex
      level: 4
      description: Codex Terra
      options:
        effort:
          default: medium
          values:
            low: {}
            medium: {}
            high: {}

regions: {}
profiles: {}
grants: {}
environments:
  default: local
  values:
    local:
      database: http://localhost:5176
      store: http://localhost:5176
      licenseKey: ""

terminalInputAllowed: true
