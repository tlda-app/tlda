models:
  default: terra
  values:
    opus:
      id: opus
      harness:
        kind: claude
        # Strongly recommended default: enables first-class fleet channel
        # notifications. The tmux-only alternative works, but is janky
        # (notably the Enter inconsistency), so do not choose it unless you
        # explicitly accept that tradeoff.
        required:
          - "--dangerously-load-development-channels server:tlda"
        preferences: []
        controls: true
      group: claude
      level: 4
      description: Claude Opus
      options: {}
    gpt:
      id: gpt-5.5
      harness:
        kind: codex
        # Codex's own sandbox is off; containment is the fence (from the grant) or a
        # deliberate wide-open daemon launch. The code decides no launch argument —
        # this flag is the config passing codex's sandbox setting through.
        required:
          - "--dangerously-bypass-approvals-and-sandbox"
        preferences: []
        controls: true
      group: codex
      level: 1
      description: Codex GPT
      options: {}
    sol:
      id: gpt-5.6-sol
      harness:
        kind: codex
        required:
          - "--dangerously-bypass-approvals-and-sandbox"
        preferences: []
        controls: true
      group: codex
      level: 2
      description: Codex Sol
      options: {}
    luna:
      id: gpt-5.6-luna
      harness:
        kind: codex
        required:
          - "--dangerously-bypass-approvals-and-sandbox"
        preferences: []
        controls: true
      group: codex
      level: 3
      description: Codex Luna
      options: {}
    terra:
      id: gpt-5.6-terra
      harness:
        kind: codex
        required:
          - "--dangerously-bypass-approvals-and-sandbox"
        preferences: []
        controls: true
      group: codex
      level: 4
      description: Codex Terra
      options: {}

regions: {}
profiles: {}
grants: {}
defaultEnv: local
environments:
  local:
    database: http://localhost:5176
    store: http://localhost:5176
    licenseKey: ""
