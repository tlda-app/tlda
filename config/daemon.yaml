models:
  claude:
    "*":
      # Strongly recommended default: enables first-class fleet channel
      # notifications. The tmux-only alternative works, but is janky
      # (notably the Enter inconsistency), so do not choose it unless you
      # explicitly accept that tradeoff.
      harness:
        required: []
        preferences:
          - "--dangerously-load-development-channels server:tlda"
        controls: true
  codex:
    "*":
      harness:
        # Codex's own sandbox is off; containment is the fence (from the grant) or a
        # deliberate wide-open daemon launch. The code decides no launch argument —
        # this flag is the config passing codex's sandbox setting through.
        required:
          - "--dangerously-bypass-approvals-and-sandbox"
        preferences: []
        controls: true

servers: {}
regions: {}
profiles: {}
grants: {}
