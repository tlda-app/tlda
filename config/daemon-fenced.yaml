models:
  claude:
    opus: claude-opus-4-8[1m]
    "*":
      # Strongly recommended default: enables first-class fleet channel
      # notifications. The tmux-only alternative works, but is janky
      # (notably the Enter inconsistency), so do not choose it unless you
      # explicitly accept that tradeoff.
      harness:
        required:
          - "--dangerously-load-development-channels server:tlda"
        preferences:
          - "--dangerously-skip-permissions"
        controls: true
  codex:
    gpt: gpt-5.5
    sol: gpt-5.6-sol
    luna: gpt-5.6-luna
    terra: gpt-5.6-terra
    "*":
      harness:
        required: []
        preferences:
          - "--dangerously-bypass-approvals-and-sandbox"
        controls: true

servers: {}
regions:
  cwd:
    - cwd
  temp:
    - /tmp
    - /tmp/**
    - /private/tmp
    - /private/tmp/**
  agent-state-read:
    - ~/.codex
    - ~/.claude
    - ~/.claude/**
    - ~/.config/tlda
    - ~/.config/tlda/**
  agent-state-write:
    - ~/.cache/**
    - ~/.codex/**
    - ~/.claude*
    - ~/.claude/**
  work:
    - ~/work/**
  apps:
    - ~/work/tlda/**
  daemon-files:
    - ~/.config/tlda/fleet-daemon.log
    - ~/.config/tlda/fleet-daemon.pid
    - ~/.config/tlda/fleet-daemon.lock
  browser-runtime:
    - /tmp/tlda-pw-runtime
    - /tmp/tlda-pw-runtime/**
    - ~/Library/Caches/ms-playwright
    - ~/Library/Caches/ms-playwright/**
  daemon-db:
    - ~/.config/tlda/fleet.db*
  secrets:
    - ~/.ssh/id_*
    - ~/.aws/credentials
    - "**/.env"
  machine:
    - "**"

profiles:
  readonly:
    read:
      allow:
        - cwd
        - temp
        - agent-state-read
      deny:
        - secrets
    write:
      allow: []
      deny:
        - secrets
  wd:
    read:
      allow:
        - cwd
        - temp
        - agent-state-read
      deny:
        - secrets
    write:
      allow:
        - cwd
        - temp
        - agent-state-write
      deny:
        - daemon-db
        - secrets
  math:
    read:
      allow:
        - work
        - temp
        - agent-state-read
      deny:
        - secrets
    write:
      allow:
        - work
        - temp
        - agent-state-write
      deny:
        - apps
        - daemon-db
        - secrets
  app:
    read:
      allow:
        - cwd
        - temp
        - daemon-files
        - browser-runtime
        - agent-state-read
      deny:
        - secrets
    write:
      allow:
        - cwd
        - temp
        - daemon-files
        - browser-runtime
        - agent-state-write
      deny:
        - daemon-db
        - secrets
  ops:
    read:
      allow:
        - machine
      deny:
        - secrets
    write:
      allow:
        - machine
      deny:
        - daemon-db
        - secrets

grants:
  fleet:skip: ops
