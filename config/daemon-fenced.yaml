models:
  default: terra
  values:
    opus:
      id: opus
      harness:
        kind: claude
        # Strongly recommended default: enables first-class fleet channel
        # notifications. The tmux-only alternative works, but is janky
        # (notably the Enter inconsistency), so do not choose it unless you
        # explicitly accept that tradeoff.
        required:
          - "--dangerously-load-development-channels server:tlda"
        preferences:
          - "--dangerously-skip-permissions"
        controls: true
      group: claude
      level: 4
      description: Claude Opus
      options: {}
    gpt:
      id: gpt-5.5
      harness:
        kind: codex
        required: []
        preferences:
          - "--dangerously-bypass-approvals-and-sandbox"
        controls: true
      group: codex
      level: 1
      description: Codex GPT
      options: {}
    sol:
      id: gpt-5.6-sol
      harness:
        kind: codex
        required: []
        preferences:
          - "--dangerously-bypass-approvals-and-sandbox"
        controls: true
      group: codex
      level: 2
      description: Codex Sol
      options: {}
    luna:
      id: gpt-5.6-luna
      harness:
        kind: codex
        required: []
        preferences:
          - "--dangerously-bypass-approvals-and-sandbox"
        controls: true
      group: codex
      level: 3
      description: Codex Luna
      options: {}
    terra:
      id: gpt-5.6-terra
      harness:
        kind: codex
        required: []
        preferences:
          - "--dangerously-bypass-approvals-and-sandbox"
        controls: true
      group: codex
      level: 4
      description: Codex Terra
      options: {}

environments:
  default: local
  values:
    local:
      database: http://localhost:5176
      store: http://localhost:5176
      licenseKey: ""

regions:
  cwd:
    - cwd
  temp:
    - /tmp
    - /tmp/**
    - /private/tmp
    - /private/tmp/**
  agent-state-read:
    - ~/.codex
    - ~/.claude
    - ~/.claude/**
    - ~/.config/tlda
    - ~/.config/tlda/**
  agent-state-write:
    - ~/.cache/**
    - ~/.codex/**
    - ~/.claude*
    - ~/.claude/**
  work:
    - ~/work/**
  apps:
    - ~/work/tlda/**
  daemon-files:
    - ~/.config/tlda/fleet-daemon.log
    - ~/.config/tlda/fleet-daemon.pid
    - ~/.config/tlda/fleet-daemon.lock
  browser-runtime:
    - /tmp/tlda-pw-runtime
    - /tmp/tlda-pw-runtime/**
    - ~/Library/Caches/ms-playwright
    - ~/Library/Caches/ms-playwright/**
  daemon-db:
    - ~/.config/tlda/fleet.db*
  secrets:
    - ~/.ssh/id_*
    - ~/.aws/credentials
    - "**/.env"
  machine:
    - "**"

profiles:
  readonly:
    read:
      allow:
        - cwd
        - temp
        - agent-state-read
      deny:
        - secrets
    write:
      allow: []
      deny:
        - secrets
  wd:
    read:
      allow:
        - cwd
        - temp
        - agent-state-read
      deny:
        - secrets
    write:
      allow:
        - cwd
        - temp
        - agent-state-write
      deny:
        - daemon-db
        - secrets
  math:
    read:
      allow:
        - work
        - temp
        - agent-state-read
      deny:
        - secrets
    write:
      allow:
        - work
        - temp
        - agent-state-write
      deny:
        - apps
        - daemon-db
        - secrets
  app:
    read:
      allow:
        - cwd
        - temp
        - daemon-files
        - browser-runtime
        - agent-state-read
      deny:
        - secrets
    write:
      allow:
        - cwd
        - temp
        - daemon-files
        - browser-runtime
        - agent-state-write
      deny:
        - daemon-db
        - secrets
  ops:
    read:
      allow:
        - machine
      deny:
        - secrets
    write:
      allow:
        - machine
      deny:
        - daemon-db
        - secrets

grants:
  fleet:skip: ops
