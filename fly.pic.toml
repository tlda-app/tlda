# fly.pic.toml — the QTM 285 course backend ("Prediction, Inference, and Causality").
# A peer of live and stable: same image, same entrypoint, its own app, volume and
# tailnet name, so course content and student identity live in their own
# environment rather than in testing.
# Deploy with:  fly deploy -c fly.pic.toml
app = "tlda-pic"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.live"

[processes]
  app = "/app/fly-entrypoint-live.sh"
  edge = "/app/fly-entrypoint-edge.sh"

[env]
  PORT = "5176"
  HOST = "::"
  NODE_ENV = "production"
  # Everything else this server needs lives in config/deployments/pic/, committed
  # and baked into the image. TLDA_DEPLOYMENT names that directory and is the only
  # pointer that must arrive from outside it.
  TLDA_DEPLOYMENT = "pic"
  # The tailnet node name, and therefore the URL: pic.example-tailnet.ts.net.
  # Live and stable carry this as a `fly secrets` value; it is not a secret, and an
  # unset one silently collides with live's default of `tlda-fly`, so it is
  # committed here where a reader can see which box answers which name. The
  # hostname must stay inside *.example-tailnet.ts.net — the tldraw license is
  # bound to that domain and a *.fly.dev name would lose the canvas.
  TS_HOSTNAME = "pic"
  # The course is student-facing. Funnel exposes this licensed hostname publicly;
  # server.yaml's token gate remains the application boundary.
  TS_FUNNEL = "1"
  # The edge is the stable student-facing front door. A staged release changes
  # this file by same-directory rename; the database and classroom rooms remain
  # mounted only on the app process.
  TLDA_EDGE_UPSTREAM = "app.process.tlda-pic.internal:5176"
  TLDA_EDGE_UPSTREAM_POINTER = "/var/lib/tlda-edge/upstream"
  TLDA_EDGE_LISTEN_PORT = "5177"
  TLDA_EDGE_HOLD_SECONDS = "180"
  TLDA_EDGE_RETRY_MS = "250"
  TLDA_EDGE_HEALTH_PORT = "5178"

  # The preview site, as ports on this name rather than a second app: 443 is the
  # course, 8443 its preview's store, 10000 the built copy the preview serves as
  # files. Funnel publishes exactly those three ports and no others, which is
  # what fixes the numbers.
  #
  # NOT BECAUSE THE LICENCE NEEDS IT. An earlier version of this comment said the
  # tldraw licence is bound to a hostname and therefore the preview had to share
  # this one. That is false -- the key is issued for *.cormorant-matrix.ts.net
  # (config/deployments/preview-store/daemon.yaml) and covers every box on this
  # tailnet. Recorded rather than deleted, because it was the stated reason for
  # the shape and someone reading the shape will look for one.
  #
  # Skip, 2026-09-21: *"pic isnt s build server"*, after *"i do not want my
  # fucking build server to be the host"*. The box with the executor on it is
  # pic-dev (fly.pic-dev.toml); this one serves.
  #
  # The app process runs both (scripts/fly-entrypoint-live.sh); the edge fronts
  # and publishes them, because the tailnet node lives there and not with the
  # app.
  TLDA_PREVIEW_DEPLOYMENT = "preview-store"
  TLDA_STATIC_DIR = "/app/server/persist/static-site"
  # THIS BOX TAKES THE COPY, it does not make it. Skip's design, 2026-09-21:
  # *"either it sends buolds directly to the preview box or testing sends them
  # to the preview box (pic) when it gets them back from the builder"* — so the
  # render happens where the source is, and what arrives here is a finished
  # tree. server/routes/preview-copy.mjs mounts only because of this line, and
  # refuses every request until TLDA_PREVIEW_COPY_SECRET is set as a Fly secret.
  TLDA_PREVIEW_COPY_RECEIVE = "1"
  TLDA_EDGE_EXTRA_PORTS = "5179,5180"
  TLDA_EDGE_PREVIEW_PORTS = "8443:5179 10000:5180"

# No [http_service] — public access uses `tailscale funnel` on the licensed
# *.example-tailnet.ts.net hostname; see scripts/fly-entrypoint-live.sh. No Fly
# public service means no autostop, so the machine stays running on its CMD and
# its persistent volume.
[[vm]]
  size = "performance-2x"
  memory = "4096"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512"
  processes = ["edge"]

# Course content, fleet.db and sync data. Same mount point as live and stable so
# the shared entrypoint's symlinks resolve.
[[mounts]]
  source = "sync_data"
  destination = "/app/server/persist"
  processes = ["app"]

[[mounts]]
  source = "pic_edge_ts_state"
  destination = "/var/lib/tlda-edge"
  processes = ["edge"]
