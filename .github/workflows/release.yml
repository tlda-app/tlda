name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  full-test-suite:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - name: Run discovered test suite
        run: |
          npm ci
          npm test

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - name: Verify release
        run: |
          npm ci
          npm run build
          npm run lint
          node --test \
            bin/mcp-login-delegate-session-contract-test.mjs \
            bin/release-preflight-test.mjs \
            tests/daemon-status-liveness-contract.test.mjs \
            tests/terminal-composer-voice-send.test.mjs \
            tests/terminal-input-policy.test.mjs
          mkdir -p server/public
          cp -r dist/* server/public/

      - name: Create release archive
        run: |
          VERSION=${GITHUB_REF_NAME}
          # Pack everything except node_modules, dist, .git
          tar --exclude='./node_modules' \
              --exclude='./dist' \
              --exclude='./.git' \
              --exclude='./.worktrees' \
              --exclude='./.claude' \
              --exclude='./scratch' \
              --exclude='./server/data' \
              --exclude='./server/projects' \
              --exclude='./test-results' \
              -czf /tmp/tlda-${VERSION}.tar.gz .
          # Print SHA256 for Homebrew formula
          shasum -a 256 /tmp/tlda-${VERSION}.tar.gz
          echo "ARCHIVE=/tmp/tlda-${VERSION}.tar.gz" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          body_path: .github/release-notes-v0.4.0.md
