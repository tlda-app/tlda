name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  full-test-suite:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - name: Run discovered test suite
        run: |
          npm ci
          npm test

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - name: Verify release
        run: |
          npm ci
          npm run build
          npm run lint
          node --test \
            bin/mcp-login-delegate-session-contract-test.mjs \
            bin/release-preflight-test.mjs \
            tests/daemon-status-liveness-contract.test.mjs \
            tests/terminal-composer-voice-send.test.mjs \
            tests/terminal-input-policy.test.mjs
          mkdir -p server/public
          cp -r dist/* server/public/

      - name: Create release archive
        run: |
          VERSION=${GITHUB_REF_NAME}
          # Pack everything except node_modules, dist, .git
          tar --exclude='./node_modules' \
              --exclude='./dist' \
              --exclude='./.git' \
              --exclude='./.worktrees' \
              --exclude='./.claude' \
              --exclude='./.github' \
              --exclude='./.mcp.json' \
              --exclude='./.tlda-daemon.yaml' \
              --exclude='./AGENTS.md' \
              --exclude='./CLAUDE.md' \
              --exclude='./foundation' \
              --exclude='./paper' \
              --exclude='./prototypes' \
              --exclude='./recipes' \
              --exclude='./scratch' \
              --exclude='./telemetry' \
              --exclude='./the-list.md' \
              --exclude='./config/daemon-fenced.yaml' \
              --exclude='./config/deployments' \
              --exclude='./fly.*.toml' \
              --exclude='./docs/bot-supervision-2026-08-10.md' \
              --exclude='./docs/chat-rendering.md' \
              --exclude='./docs/chat-scrollback-prefetch-design.md' \
              --exclude='./docs/classroom.md' \
              --exclude='./docs/course-release.md' \
              --exclude='./docs/current-main-architecture.md' \
              --exclude='./docs/daemon-server-protocol.md' \
              --exclude='./docs/daemon-server-protocol-proposal.md' \
              --exclude='./docs/environments.md' \
              --exclude='./docs/fleet-agents.md' \
              --exclude='./docs/fleet-chat-artifacts.md' \
              --exclude='./docs/fleet-db-vacuum-runbook.md' \
              --exclude='./docs/images' \
              --exclude='./docs/identity-and-labeling.md' \
              --exclude='./docs/live-deploy.md' \
              --exclude='./docs/naming-errata.md' \
              --exclude='./docs/notifications-and-liveness.md' \
              --exclude='./docs/permissions-implementation-contract.md' \
              --exclude='./docs/release-candidate.md' \
              --exclude='./docs/settings-controls.md' \
              --exclude='./docs/source-authority-state-machine.md' \
              --exclude='./docs/the-instrument-or-the-code.md' \
              --exclude='./docs/the-sync-model.md' \
              --exclude='./docs/voice-path-known-defects.md' \
              --exclude='./docs/vendored-tldraw-editor.md' \
              --exclude='./docs/what-in-app-editing-does-not-do.md' \
              --exclude='./docs/what-sync-owes.md' \
              --exclude='./docs/what-the-old-push-did.md' \
              --exclude='./docs/window-manager.md' \
              --exclude='./extensions/tlda-classroom-positron' \
              --exclude='./server/data' \
              --exclude='./server/projects' \
              --exclude='./test-results' \
              --exclude='./tests/fixtures/classroom-course' \
              -czf /tmp/tlda-${VERSION}.tar.gz .
          # Print SHA256 for Homebrew formula
          shasum -a 256 /tmp/tlda-${VERSION}.tar.gz
          echo "ARCHIVE=/tmp/tlda-${VERSION}.tar.gz" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          body_path: .github/release-notes-v0.4.0.md
