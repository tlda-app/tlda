# fly.live.toml — the LIVE tlda backend (takes over the existing tldraw-sync-skip app).
# Headless: API + Yjs sync + LaTeX builds + content/data. The tldraw SPA is NOT served
# here — it runs from GitHub Pages (license-tied) and points at this backend.
# Deploy with:  fly deploy -c fly.live.toml
app = "tldraw-sync-skip-rc"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.live"

[env]
  PORT = "5176"
  NODE_ENV = "production"
  # The canonical fleet server URL reported from /api/fleet-config. Now the private
  # TAILNET name (the server is gated behind Tailscale): the SPA is served from this
  # same origin, so clients resolve fleet/chat to the tailnet name = their own origin.
  TLDA_FLEET_SERVER = "https://tlda-fly.cormorant-matrix.ts.net"
  # Auth posture: the server is gated at the NETWORK layer by Tailscale (only tailnet
  # devices can reach it), so the app runs open INSIDE the tailnet — no per-request
  # token, terminal works tokenless. The tailnet IS the auth (Skip's chosen model).
  TLDA_NO_AUTH = "1"
  # Fleet chat uploads (markdown chips, attachments) must live on the persistent
  # volume, not /tmp (which the container wipes on restart/redeploy — that wiped
  # markdown-chip files out from under their chips, 404ing the annotation viewer).
  TLDA_UPLOAD_DIR = "/app/server/persist/uploads"

# No [http_service] — the server is NOT exposed on the public internet. Access is
# tailnet-only via `tailscale serve` (see fly-entrypoint-live.sh). The machine stays
# running on its CMD + the persistent volume mount (no public service = no autostop).
[[vm]]
  size = "performance-2x"
  memory = "4096"

# 10 GB volume for mutable content/data: projects (~3.7G), fleet.db (~568M), yjs data.
# If reusing the existing sync_data volume, extend it to 10G:  fly volumes extend <id> -s 10
[mounts]
  source = "sync_data"
  destination = "/app/server/persist"
