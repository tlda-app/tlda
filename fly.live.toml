# fly.live.toml — the LIVE tlda backend (takes over the existing tldraw-sync-skip app).
# Headless: API + Yjs sync + LaTeX builds + content/data. The tldraw SPA is NOT served
# here — it runs from GitHub Pages (license-tied) and points at this backend.
# Deploy with:  fly deploy -c fly.live.toml
app = "tldraw-sync-skip"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.live"

# Two process groups, and the split is the whole point: `app` is the machine that
# carries the volume and therefore has to stop to be redeployed; `edge` is the
# tailnet node and the front door, and a `fly deploy --process-groups app` leaves
# it running. Deploying `edge` is a separate, rare act — it is the only thing that
# takes the .ts.net name down.
[processes]
  app = "/app/fly-entrypoint-live.sh"
  edge = "/app/fly-entrypoint-edge.sh"

[env]
  PORT = "5176"
  # The edge reaches the app through Fly's 6PN process DNS, which resolves to
  # the app machine's IPv6 address. Node's default 0.0.0.0 listener is IPv4
  # only; bind the app on IPv6 (dual-stack on Fly's Linux guest) so both the
  # edge and the app-local Tailscale proxy can reach it.
  HOST = "::"
  NODE_ENV = "production"
  # Read only by the `edge` process (scripts/fly-edge-proxy.mjs), which refuses to
  # start without all four rather than inventing a default.
  #
  # 6PN DNS, resolved per connection attempt: it is the app machine's address that
  # changes when the machine is replaced.
  TLDA_EDGE_UPSTREAM = "app.process.tldraw-sync-skip.internal:5176"
  TLDA_EDGE_LISTEN_PORT = "5177"
  # Longer than the gap it covers. The measured gap on 2026-08-18 was ~60s
  # (machine stop 03:11:45Z, serving 03:12:45Z); a cold start on this box has been
  # measured near 90s. Holding is what the person experiences as "slow", so this
  # is the number to argue about, and it is here rather than in the code.
  TLDA_EDGE_HOLD_SECONDS = "180"
  TLDA_EDGE_RETRY_MS = "250"
  # Health, on its own port so the proxied path stays a pipe that does not parse.
  # It answers the one question a curl against the tailnet name cannot: whether
  # it is the edge machine or the app machine that is missing.
  TLDA_EDGE_HEALTH_PORT = "5178"
  # Everything else this server needs now lives in config/deployments/live/,
  # committed and baked into the image. TLDA_DEPLOYMENT names that directory and
  # is the only pointer that must arrive from outside it.
  TLDA_DEPLOYMENT = "live"

# No [http_service] — the server is NOT exposed on the public internet. Access is
# tailnet-only via `tailscale serve` (see fly-entrypoint-live.sh). The machine stays
# running on its CMD + the persistent volume mount (no public service = no autostop).
[[vm]]
  size = "performance-2x"
  memory = "4096"
  processes = ["app"]

# The edge machine runs a tailnet node and a TCP pipe. It opens no database and
# serves no files, so it is sized for what it is.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512"
  processes = ["edge"]

# 10 GB volume for mutable content/data: projects (~3.7G), fleet.db (~568M), yjs data.
# If reusing the existing sync_data volume, extend it to 10G:  fly volumes extend <id> -s 10
[[mounts]]
  source = "sync_data"
  destination = "/app/server/persist"
  processes = ["app"]

# Tailscaled's node key, and nothing else. Without somewhere to keep it the edge
# machine joins the tailnet as a NEW node on every boot and Tailscale hands it
# tlda-fly-1, tlda-fly-2, … — which moves the URL Skip has open.
[[mounts]]
  source = "edge_ts_state"
  destination = "/var/lib/tlda-edge"
  processes = ["edge"]
