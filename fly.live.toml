# fly.live.toml — the live tlda backend.
# Headless: API + Yjs sync + LaTeX builds + content/data. The tldraw SPA is NOT served
# here — it runs from GitHub Pages (license-tied) and points at this backend.
# Deploy with:  fly deploy -c fly.live.toml
app = "your-tlda-live"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.live"

# Two process groups, and the split is the whole point: `app` is the machine that
# carries the volume and therefore has to stop to be redeployed; `edge` is the
# tailnet node and the front door, and a `fly deploy --process-groups app` leaves
# it running. Deploying `edge` is a separate, rare act — it is the only thing that
# takes the .ts.net name down.
[processes]
  app = "/app/fly-entrypoint-live.sh"
  edge = "/app/fly-entrypoint-edge.sh"

[env]
  PORT = "5176"
  # The edge reaches the app through Fly's 6PN process DNS, which resolves to
  # the app machine's IPv6 address. Node's default 0.0.0.0 listener is IPv4
  # only; bind the app on IPv6 (dual-stack on Fly's Linux guest) so both the
  # edge and the app-local Tailscale proxy can reach it.
  HOST = "::"
  NODE_ENV = "production"
  # Read only by the `edge` process (scripts/fly-edge-proxy.mjs), which refuses to
  # start without all four rather than inventing a default.
  #
  # 6PN DNS, resolved per connection attempt: it is the app machine's address that
  # changes when the machine is replaced.
  TLDA_EDGE_UPSTREAM = "app.process.your-tlda-live.internal:5176"
  TLDA_EDGE_LISTEN_PORT = "5177"
  # Longer than the expected machine-replacement and cold-start gap. Holding is
  # what the client experiences as delay, so this value is deployment configuration
  # rather than an application default.
  TLDA_EDGE_HOLD_SECONDS = "180"
  TLDA_EDGE_RETRY_MS = "250"
  # Health, on its own port so the proxied path stays a pipe that does not parse.
  # It answers the one question a curl against the tailnet name cannot: whether
  # it is the edge machine or the app machine that is missing.
  TLDA_EDGE_HEALTH_PORT = "5178"
  # Everything else this server needs now lives in config/deployments/live/,
  # committed and baked into the image. TLDA_DEPLOYMENT names that directory and
  # is the only pointer that must arrive from outside it.
  TLDA_DEPLOYMENT = "live"

  # THE PREVIEW SITE IS SOMEWHERE ELSE, and this is the box that feeds it.
  #
  # Skip's design, 2026-09-21: *"either it sends buolds directly to the preview
  # box or testing sends them to the preview box (pic) when it gets them back
  # from the builder"*. This is the second: the source lives here, the render
  # goes out to the executor and comes back here, and when the build publishes,
  # server/lib/build-dispatch.mjs assembles a copy and POSTs it to the host.
  # Nothing about a destination reaches the executor, which stays a renderer.
  #
  # ONE PROJECT, because a copy is a flat tree — every page sits at the root,
  # which is the URL a link points at, so two documents in one copy would be two
  # documents at one address.
  TLDA_PREVIEW_PROJECT = "qtm285-book"
  # The destination whose store address and licence are patched into the copy.
  # A box that runs a preview store gets this from its entrypoint; this one does
  # not run one, so it names the committed directory itself.
  TLDA_PREVIEW_DESTINATION = "/app/config/deployments/preview-store"
  # 6PN, not the tailnet: these machines run tailscale with
  # --tun=userspace-networking, so there is no interface for another Fly app to
  # route a 100.x address over, and `.internal` is how they already reach each
  # other. The host's own receiver checks this address is a 6PN peer before it
  # unpacks anything, so the two halves agree about which network this is.
  #
  # TLDA_PREVIEW_COPY_SECRET is a SECRET, not an env entry — `fly secrets set`.
  # Unset here and the copy is refused there; unset there and the route refuses
  # everything rather than defaulting open.
  # 5181, not the server's port: the receiver is its own listener on the host's
  # private address (config there, and server/routes/preview-copy.mjs for why).
  TLDA_PREVIEW_HOST = "http://app.process.tlda-pic.internal:5181"

# No [http_service] — the server is NOT exposed on the public internet. Access is
# tailnet-only via `tailscale serve` (see fly-entrypoint-live.sh). The machine stays
# running on its CMD + the persistent volume mount (no public service = no autostop).
[[vm]]
  size = "performance-2x"
  memory = "4096"
  processes = ["app"]

# The edge machine runs a tailnet node and a TCP pipe. It opens no database and
# serves no files, so it is sized for what it is.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512"
  processes = ["edge"]

# 10 GB volume for mutable project, fleet, and collaboration data.
# If reusing the existing sync_data volume, extend it to 10G:  fly volumes extend <id> -s 10
[[mounts]]
  source = "sync_data"
  destination = "/app/server/persist"
  processes = ["app"]

# Tailscaled's node key, and nothing else. Without somewhere to keep it the edge
# machine joins the tailnet as a NEW node on every boot and Tailscale hands it
# your-tlda-live-1, your-tlda-live-2, … — which moves the configured URL.
[[mounts]]
  source = "edge_ts_state"
  destination = "/var/lib/tlda-edge"
  processes = ["edge"]
