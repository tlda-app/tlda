# Test fixture owned by agent-launch/harness/*.test.mjs, which load it through
# readDaemonConfig(path). Nothing in production reads this file; the live
# daemon config is ~/.config/tlda/daemon.yaml (or $TLDA_CONFIG_DIR when set).
models:
  default: muse
  values:
    muse-claude:
      id: meta/muse-spark-1.3-contributor
      harness:
        kind: claude
        required:
          - "--dangerously-load-development-channels server:tlda"
        preferences: []
        controls: true
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_MODEL: meta/muse-spark-1.3-contributor
          ANTHROPIC_DEFAULT_OPUS_MODEL: meta/muse-spark-1.3-contributor
          ANTHROPIC_DEFAULT_SONNET_MODEL: meta/muse-spark-1.3-contributor
          ANTHROPIC_DEFAULT_HAIKU_MODEL: meta/muse-spark-1.3-contributor
          CLAUDE_CODE_SUBAGENT_MODEL: meta/muse-spark-1.3-contributor
          CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY: 1
      group: muse
      level: 1
      description: Muse Spark via Claude Code (OpenRouter)
      options:
        effort:
          default: max
          values:
            low: {}
            medium: {}
            high: {}
            max: {}
    muse:
      id: muse-spark-1.3-contributor
      harness:
        kind: muse
        required:
          - --yolo
        preferences: []
        controls: true
      group: muse
      level: 1
      options:
        effort:
          default: max
          values:
            low: {}
            medium: {}
            high: {}
            max: {}
    deepseek:
      id: deepseek-flash[1m]
      harness:
        kind: claude
        required:
          - "--dangerously-load-development-channels server:tlda"
        preferences: []
        controls: true
        env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_MODEL: deepseek-flash[1m]
          ANTHROPIC_DEFAULT_OPUS_MODEL: deepseek-flash[1m]
          ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek-flash[1m]
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-flash[1m]
          CLAUDE_CODE_SUBAGENT_MODEL: deepseek-flash[1m]
          CLAUDE_CODE_EFFORT_LEVEL: max
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "786432"
      group: deepseek
      level: 1
      description: DeepSeek V4.1 Flash via Claude Code
      options:
        effort:
          default: max
          values:
            low: {}
            medium: {}
            high: {}
            max: {}
    opus:
      id: claude-opus-5
      harness:
        kind: claude
        # Strongly recommended default: enables first-class fleet channel
        # notifications. The tmux-only alternative works, but is janky
        # (notably the Enter inconsistency), so do not choose it unless you
        # explicitly accept that tradeoff.
        required:
          - "--dangerously-load-development-channels server:tlda"
        preferences: []
        controls: true
      group: claude
      level: 4
      description: Claude Opus
      options:
        effort:
          default: medium
          values:
            low: {}
            medium: {}
            high: {}
    gpt:
      id: gpt-5.5
      harness:
        kind: codex
        # Codex's own sandbox is off; containment is the fence (from the grant) or a
        # deliberate wide-open daemon launch. The code decides no launch argument —
        # this flag is the config passing codex's sandbox setting through.
        required:
          - "--dangerously-bypass-approvals-and-sandbox"
        preferences: []
        controls: true
      group: codex
      level: 1
      description: Codex GPT
      options:
        effort:
          default: medium
          values:
            low: {}
            medium: {}
            high: {}
