# fly.pic-static.toml — SUPERSEDED. Do not deploy from this file.
#
# This app existed because a stopped lane had already provisioned it, and the
# preview site was built on it for that reason and no other. The design says the
# opposite: *"serve a literal rsynced copy from the same box on a different port
# or whatever"* — the same box, because the tldraw licence is bound to a
# hostname and a different port on the same host is the same hostname. A second
# app is a second hostname, a second volume, a second tailscale identity to
# authenticate by hand, and a second set of secrets, and it buys nothing.
#
# So the preview site is now opt-in by intent on whichever box already serves:
# `TLDA_STATIC_DIR` for the copy and `TLDA_PREVIEW_DEPLOYMENT` for its store,
# both in scripts/fly-entrypoint-live.sh. This app's machine is still up and
# still serving what was pushed to it; the file is kept so that is not a
# mystery, and because retiring an app is a separate, deliberate act.
#
# A deploy from here would now FAIL at boot: the entrypoint no longer has a
# branch for `TLDA_DEPLOYMENT = pic-static`, and that deployment's server.yaml
# and daemon.yaml are the empty placeholders it needed when nothing read them.
app = "tlda-pic-static"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.live"

[env]
  PORT = "5176"
  NODE_ENV = "production"
  TLDA_DEPLOYMENT = "pic-static"
  TS_HOSTNAME = "tlda-pic-static"

  # PUBLIC, and it has to be. Published pages' browsers connect to this box for
  # sync, and students hand homework in to it from the Positron extension, so
  # tailnet-only is not available to it the way it is to pic-preview. The two
  # tlda servers are token-gated in their own server.yaml, which is what makes
  # a funneled box safe; the file server serves only what is already published.
  TS_FUNNEL = "1"

  # Directory the file server points at. On the volume, so it survives
  # restarts; written by rsync from outside, never by this box.
  TLDA_STATIC_DIR = "/app/server/persist/static-site"

  # Secrets this box needs, set with `fly secrets set -a tlda-pic-static`:
  # TLDA_TOKEN_READ and TLDA_TOKEN_RW — both tlda servers here run
  # `tokensFromEnvironmentOnly: true` with the gate on, so these are the
  # application boundary in front of student submissions.
  #
  # Secrets this box no longer uses (named, not deleted — secret deletion is
  # a separate reversible act): TLDA_BUILD_EXECUTOR_TOKEN, CLASSROOM_AGENTS_GITHUB_TOKEN.

[[vm]]
  size = "performance-2x"
  # Class builds OOM at small sizes; keep parity with pic-dev.
  memory = "8192"

[mounts]
  source = "static_sync_data"
  destination = "/app/server/persist"
